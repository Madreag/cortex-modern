// Tests.rte determinism + perf scenarios. Each is a GAScripted activity; ScenarioRunner
// (CLI -scenario <name>) looks them up by PresetName "Determinism <name>" (the prefix is auto-padded).
// IsTestActivity = 1 hides them from the regular scenarios menu.

AddActivity = GAScripted
	PresetName = Net Lifecycle Test
	Description = Unarmed sentries for elapsed-time multiplayer lifecycle checks.
	SceneName = Grasslands
	ScriptPath = Tests.rte/Activities/NetLifecycleTest.lua
	LuaClassName = NetLifecycleTest
	MinTeamsRequired = 1
	IsTestActivity = 1
	DefaultRequireClearPathToOrbit = 0
	DefaultFogOfWar = 0
	DefaultDeployUnits = 0

// Determinism baseline scenario. ScenarioRunner accepts either "Determinism SimBaseline"
// or the bare "SimBaseline" form (ResolvePresetName pads the prefix).
AddActivity = GAScripted
	PresetName = Determinism SimBaseline
	Description = Determinism baseline (one sentry, 10 sim-seconds).
	SceneName = Grasslands
	ScriptPath = Tests.rte/Activities/SimBaseline.lua
	LuaClassName = TestScenarioSimBaseline
	MinTeamsRequired = 1
	IsTestActivity = 1
	DefaultRequireClearPathToOrbit = 0
	DefaultFogOfWar = 0
	DefaultDeployUnits = 0

// Determinism — terrain-destruction stress. Two squads fight on open ground
// with rocket launchers and frag grenades while a scripted carve cascade marches
// across the field; exercises the `terrain` subsystem of the per-tick trace.
AddActivity = GAScripted
	PresetName = Determinism TerrainStress
	Description = Determinism — terrain destruction (rockets + grenades, open map).
	SceneName = Grasslands
	ScriptPath = Tests.rte/Activities/TerrainStress.lua
	LuaClassName = TestScenarioTerrainStress
	MinTeamsRequired = 1
	IsTestActivity = 1
	DefaultRequireClearPathToOrbit = 0
	DefaultFogOfWar = 0
	DefaultDeployUnits = 0

