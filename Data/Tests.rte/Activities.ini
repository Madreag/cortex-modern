// Tests.rte determinism + perf scenarios. Each is a GAScripted activity; ScenarioRunner
// (CLI -scenario <name>) looks them up by PresetName "Trust <name>" (the prefix is auto-padded).
// IsTestActivity = 1 hides them from the regular scenarios menu.

// Determinism baseline scenario. ScenarioRunner accepts either "Trust M1Baseline"
// or the bare "M1Baseline" form (the ScenarioRunner::ResolvePresetName prefix-pads "Trust ").
AddActivity = GAScripted
	PresetName = Trust M1Baseline
	Description = Determinism baseline (one sentry, 10 sim-seconds).
	SceneName = Grasslands
	ScriptPath = Tests.rte/Activities/M1Baseline.lua
	LuaClassName = TestScenarioM1Baseline
	MinTeamsRequired = 1
	IsTestActivity = 1
	DefaultRequireClearPathToOrbit = 0
	DefaultFogOfWar = 0
	DefaultDeployUnits = 0

// M1 determinism — terrain-destruction stress. Two squads fight on open ground
// with rocket launchers and frag grenades while a scripted carve cascade marches
// across the field; exercises the `terrain` subsystem of the per-tick trace.
AddActivity = GAScripted
	PresetName = Trust M1TerrainStress
	Description = Determinism — terrain destruction (rockets + grenades, open map).
	SceneName = Grasslands
	ScriptPath = Tests.rte/Activities/M1TerrainStress.lua
	LuaClassName = TestScenarioM1TerrainStress
	MinTeamsRequired = 1
	IsTestActivity = 1
	DefaultRequireClearPathToOrbit = 0
	DefaultFogOfWar = 0
	DefaultDeployUnits = 0

