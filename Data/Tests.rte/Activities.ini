// M0 trust-suite scenarios. Each is a GAScripted activity. ScenarioRunner (CLI -scenario AI-NN)
// looks them up by PresetName "Trust AI-NN". IsTestActivity = 1 hides them from the regular
// scenarios menu unless SettingsMan ShowTestActivities is true (default true in Debug builds).
// All scenarios share the "Tutorial Bunker" terrain for reproducibility.

AddActivity = GAScripted
	PresetName = Trust AI-01
	Description = Defend the brain room.
	SceneName = Tutorial Bunker
	ScriptPath = Tests.rte/Activities/AI-01.lua
	LuaClassName = TestScenarioAI01
	MinTeamsRequired = 1
	IsTestActivity = 1
	DefaultRequireClearPathToOrbit = 0
	DefaultFogOfWar = 0
	DefaultDeployUnits = 0

