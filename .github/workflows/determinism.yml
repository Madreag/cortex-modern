# Determinism CI gate (blocking).
#
# The simulation is deterministic — the per-tick BLAKE3 state hash is bit-identical
# across runs, thread counts, and OSes for a given seed + scenario. Any divergence
# fails the build. The determinism-check's -determinism-selftest-perturb positive
# control proves the gate still detects a real divergence.
#
# Scenarios:
#   M1Baseline       — one sentry, 600 ticks. Minimal envelope.
#   M1TerrainStress  — three brain-hunters carving terrain, 900 ticks.
#                      Exercises the `terrain` subsystem (and indirectly
#                      `decisions` / `sim_rng` / `actors`).
#   M1ActorStress    — 20-sentry deterministic grid, 600 ticks. Exercises
#                      Block C's MOID sort under heavier population.
#   M2LuaBaseline    — no actors, main-thread Lua RNG, 600 ticks. Exercises the
#                      lua_state subsystem.
#   M2LuaRandomStress — no actors, main-thread math.random, 600 ticks.
#   M2PairsStress     — no actors, main-thread pairs() iteration, 600 ticks.
#   M2OsStubTest      — no actors, main-thread os.time/os.clock stubs, 600 ticks.
#   M2ModSmokeLoading — 4 brain-hunters, 600 ticks. Actor AI Lua smoke test (runs
#                       threaded AI Lua, so no-error-only, not a MATCH test).
#
# Cross-OS:
#   determinism-cross-os depends on both Linux and Windows jobs and downloads
#   their per-tick traces, then compares the M1Baseline scenario's per-tick
#   `total` hashes. Linux gcc + Windows MSVC are expected to match at M1 with
#   Blocks B-E in place; macOS / ARM / WASM are M5's job.
#
# Local equivalent (Windows):
#   "Cortex Command.exe" -determinism-check --scenario M1Baseline --ticks 600 \
#                                           --seed 42 --runs 100 --output report.json
# Local equivalent (Linux):
#   ./CortexCommand -determinism-check --scenario M1Baseline --ticks 600 \
#                                      --seed 42 --runs 100 --output report.json
#
# MP M3 Block A adds the fixedpoint-tests jobs: they build the standalone
# FixedPoint.h test (Source/System/FixedPointTests.cpp) on each OS and compare
# its self-check hash cross-OS. These jobs are BLOCKING — the Q40.24 library is
# pure integer code, not subject to the M1 thread race, so it must be exact.
#
# MP M4 adds the determinism-thread-matrix jobs: they run M4ThreadStress through
# `-determinism-check --threads 1,2,4,8,16`, running the scenario at each Lua-
# state count and diffing the per-tick traces ACROSS counts.
#
# MP M4 outcome (Block F): M4 closed the threaded g_SimRNG race (Block C), the
# lua_state count-dependence (Block C), the render-side RNG leak, the alarm-event
# order race and the async-pathing nondeterminism (Block D). The sim is now bit-
# identical run-to-run at a fixed thread count, and bit-identical ACROSS thread
# counts for the first ~135 ticks of M4ThreadStress (the Block A baseline
# diverged at tick 0). A residual cross-thread-count divergence in the
# particle/terrain physics (~tick 136) resists; per M4_PLAN.md §7 the gate stays
# informational pending the M4-follow-up that closes it. See
# Source/Network/README.md and Source/CI/baseline_thread_divergence.md.

name: Determinism

on:
  pull_request:
    branches: [modernization-effort, flagship/mp-m1-determinism-cleanup, flagship/mp-m2-luajit-pairs, flagship/mp-m3-fixedpoint-physics, flagship/mp-m4-threaded-sim, flagship/m5.5-mp-harness, 'flagship/m4a-*', 'flagship/mp-m*']
  workflow_dispatch:

# Concurrency: one run per branch/PR, cancel in-flight if new commits arrive.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  determinism-linux:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        scenario: [M1Baseline, M1TerrainStress, M1ActorStress, M2LuaBaseline, M2LuaRandomStress, M2PairsStress, M2OsStubTest, M2ModSmokeLoading, M3TerrainStress]
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y meson ninja-build pkg-config \
            libsdl2-dev libsdl2-image-dev libpng-dev libflac-dev \
            libminizip-dev libtbb-dev liblz4-dev libgl-dev

      - name: Configure (release)
        run: meson setup builddir --buildtype=release

      - name: Build
        run: meson compile -C builddir

      - name: Run determinism-check (${{ matrix.scenario }})
        run: |
          ./builddir/CortexCommand -determinism-check \
              --scenario ${{ matrix.scenario }} \
              --ticks 600 \
              --seed 42 \
              --runs 100 \
              --output ${{ matrix.scenario }}-divergence.json

      - name: Upload divergence report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: determinism-${{ matrix.scenario }}-linux
          path: ${{ matrix.scenario }}-divergence.json
          if-no-files-found: error

      # The cross-OS check needs one real per-tick trace. Produce it from a
      # single M1Baseline run with -tick-hashes; -num-lua-states is pinned so
      # the threaded-Lua state count is identical on every OS (audit finding #7).
      - name: Produce cross-OS per-tick trace (M1Baseline only)
        if: matrix.scenario == 'M1Baseline'
        run: |
          ./builddir/CortexCommand -scenario M1Baseline -seed 42 -max-ticks 600 \
              -tick-hashes -num-lua-states 4 -out M1Baseline-trace.json

      - name: Upload cross-OS trace (M1Baseline only)
        if: matrix.scenario == 'M1Baseline'
        uses: actions/upload-artifact@v4
        with:
          name: determinism-trace-linux
          path: M1Baseline-trace.json
          if-no-files-found: error

  determinism-windows:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        scenario: [M1Baseline, M1TerrainStress, M1ActorStress, M2LuaBaseline, M2LuaRandomStress, M2PairsStress, M2OsStubTest, M2ModSmokeLoading, M3TerrainStress]
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Build (Final|x64)
        shell: pwsh
        run: |
          msbuild RTEA.sln /p:Configuration="Final" /p:Platform=x64 /m /nologo /v:minimal

      - name: Stage runtime deps
        shell: pwsh
        run: |
          Copy-Item -Path external/lib/win/fmod.dll -Destination fmod.dll -Force

      - name: Run determinism-check (${{ matrix.scenario }})
        shell: pwsh
        run: |
          & ".\Cortex Command.exe" -determinism-check `
              --scenario ${{ matrix.scenario }} `
              --ticks 600 `
              --seed 42 `
              --runs 100 `
              --output "${{ matrix.scenario }}-divergence.json"

      - name: Upload divergence report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: determinism-${{ matrix.scenario }}-windows
          path: ${{ matrix.scenario }}-divergence.json
          if-no-files-found: error

      # The cross-OS check needs one real per-tick trace (see the Linux job).
      - name: Produce cross-OS per-tick trace (M1Baseline only)
        if: matrix.scenario == 'M1Baseline'
        shell: pwsh
        run: |
          & ".\Cortex Command.exe" -scenario M1Baseline -seed 42 -max-ticks 600 `
              -tick-hashes -num-lua-states 4 -out M1Baseline-trace.json

      - name: Upload cross-OS trace (M1Baseline only)
        if: matrix.scenario == 'M1Baseline'
        uses: actions/upload-artifact@v4
        with:
          name: determinism-trace-windows
          path: M1Baseline-trace.json
          if-no-files-found: error

  determinism-cross-os:
    # Compares the Linux and Windows per-tick hash traces for M1Baseline.
    # Blocking: jq -e + set -e fail loudly if a trace is missing or empty —
    # this job never reports success without a real comparison.
    needs: [determinism-linux, determinism-windows]
    runs-on: ubuntu-latest
    steps:
      - name: Download Linux trace
        uses: actions/download-artifact@v4
        with:
          name: determinism-trace-linux
          path: ./lin

      - name: Download Windows trace
        uses: actions/download-artifact@v4
        with:
          name: determinism-trace-windows
          path: ./win

      - name: Compare per-tick total hashes (M1Baseline)
        run: |
          set -euo pipefail
          jq -e -r '.runs[0].tick_hashes[].total' lin/M1Baseline-trace.json > lin-totals.txt
          jq -e -r '.runs[0].tick_hashes[].total' win/M1Baseline-trace.json > win-totals.txt
          if [ ! -s lin-totals.txt ] || [ ! -s win-totals.txt ]; then
            echo "::error::cross-OS trace carried no per-tick hashes — the comparison cannot run"
            exit 1
          fi
          if diff lin-totals.txt win-totals.txt > /dev/null; then
            echo "Cross-OS M1Baseline: $(wc -l < lin-totals.txt) ticks bit-identical."
          else
            echo "::error::Cross-OS divergence on M1Baseline:"
            diff lin-totals.txt win-totals.txt | head -20
            exit 1
          fi

  # MP M4 Block A — thread-count determinism matrix. Runs M4ThreadStress at Lua-state
  # counts 1/2/4/8/16 and diffs the per-tick traces across counts. Non-blocking at
  # Block A; Block F flips it (and the whole gate) to blocking once M4 closes the race.
  determinism-thread-matrix-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y meson ninja-build pkg-config \
            libsdl2-dev libsdl2-image-dev libpng-dev libflac-dev \
            libminizip-dev libtbb-dev liblz4-dev libgl-dev

      - name: Configure (release)
        run: meson setup builddir --buildtype=release

      - name: Build
        run: meson compile -C builddir

      - name: Run thread-count matrix (M4ThreadStress)
        run: |
          ./builddir/CortexCommand -determinism-check \
              --scenario M4ThreadStress \
              --ticks 900 \
              --seed 42 \
              --threads 1,2,4,8,16 \
              --runs 2 \
              --output M4ThreadStress-matrix.json

      - name: Upload matrix report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: determinism-thread-matrix-linux
          path: M4ThreadStress-matrix.json
          if-no-files-found: error

  determinism-thread-matrix-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Build (Final|x64)
        shell: pwsh
        run: |
          msbuild RTEA.sln /p:Configuration="Final" /p:Platform=x64 /m /nologo /v:minimal

      - name: Stage runtime deps
        shell: pwsh
        run: |
          Copy-Item -Path external/lib/win/fmod.dll -Destination fmod.dll -Force

      - name: Run thread-count matrix (M4ThreadStress)
        shell: pwsh
        run: |
          & ".\Cortex Command.exe" -determinism-check `
              --scenario M4ThreadStress `
              --ticks 900 `
              --seed 42 `
              --threads 1,2,4,8,16 `
              --runs 2 `
              --output M4ThreadStress-matrix.json

      - name: Upload matrix report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: determinism-thread-matrix-windows
          path: M4ThreadStress-matrix.json
          if-no-files-found: error

  # MP M5.5 Block A — two-process sim sync drift, via cccp-ctl. Spawns two engine
  # processes in --parallel mode (Linux runner is headless, no window-focus race)
  # and diffs the per-tick traces. Advisory until M7 lockstep lands; then required.
  # Acceptance test 1: same scenario/seed/ticks ⇒ MATCH at every tick.
  # Acceptance test 2: --inject-divergence-role peer ⇒ DIVERGED is correctly
  # reported (EC3-MP positive control — verifies the comparator itself).
  mp-sync-drift-linux:
    runs-on: ubuntu-latest
    continue-on-error: true   # advisory until M7
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y meson ninja-build pkg-config \
            libsdl2-dev libsdl2-image-dev libpng-dev libflac-dev \
            libminizip-dev libtbb-dev liblz4-dev libgl-dev

      - name: Configure (release)
        run: meson setup builddir --buildtype=release

      - name: Build engine + cccp-ctl
        run: meson compile -C builddir CortexCommand cccp-ctl

      - name: mp-sync-drift — clean run (expect MATCH)
        run: |
          ./builddir/cccp-ctl test mp-sync-drift \
              --scenario M4ThreadStress \
              --ticks 600 --seed 42 --processes 2 --runs 1 \
              --parallel --quiet \
              --game-bin ./builddir/CortexCommand \
              --output mp-sync-drift-clean.json

      - name: mp-sync-drift — EC3-MP positive control (expect DIVERGED detected)
        run: |
          ./builddir/cccp-ctl test mp-sync-drift \
              --scenario M1Baseline \
              --ticks 200 --seed 42 --processes 2 --runs 1 \
              --inject-divergence-role peer1 --parallel --quiet \
              --game-bin ./builddir/CortexCommand \
              --output mp-sync-drift-ec3.json

      - name: mp-suite — Blocks A-D in one (quick mode)
        run: |
          ./builddir/cccp-ctl test mp-suite --quick --parallel --quiet \
              --game-bin ./builddir/CortexCommand \
              --out-dir mp-suite-out

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mp-sync-drift-linux
          path: |
            mp-sync-drift-clean.json
            mp-sync-drift-ec3.json
            mp-suite-out
          if-no-files-found: error

  # MP M3 Block A — FixedPoint.h standalone unit + determinism tests.
  fixedpoint-tests-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build FixedPointTests (g++, C++20)
        run: |
          g++ -std=c++20 -O2 -msse2 -fno-fast-math -Wall \
              -o FixedPointTests Source/System/FixedPointTests.cpp

      - name: Run FixedPointTests
        run: ./FixedPointTests | tee fixedpoint-linux.txt

      - name: Extract self-check hash
        run: grep '^SELF-CHECK:' fixedpoint-linux.txt | tr -d '\r' > fixedpoint-hash-linux.txt

      - name: Upload self-check hash
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fixedpoint-hash-linux
          path: fixedpoint-hash-linux.txt
          if-no-files-found: error

  fixedpoint-tests-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Build FixedPointTests
        shell: pwsh
        run: msbuild Source\System\FixedPointTests.vcxproj /p:Configuration=Release /p:Platform=x64 /nologo /v:minimal

      - name: Run FixedPointTests
        shell: pwsh
        run: |
          & .\Source\System\_BinTests\x64\Release\FixedPointTests.exe | Tee-Object fixedpoint-windows.txt

      - name: Extract self-check hash
        shell: pwsh
        run: |
          Select-String -Path fixedpoint-windows.txt -Pattern '^SELF-CHECK:' |
            ForEach-Object { $_.Line.Trim() } | Set-Content fixedpoint-hash-windows.txt

      - name: Upload self-check hash
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fixedpoint-hash-windows
          path: fixedpoint-hash-windows.txt
          if-no-files-found: error

  fixedpoint-tests-cross-os:
    # Blocking: the FixedPoint.h self-check must produce the same hash on every OS.
    needs: [fixedpoint-tests-linux, fixedpoint-tests-windows]
    runs-on: ubuntu-latest
    steps:
      - name: Download Linux hash
        uses: actions/download-artifact@v4
        with:
          name: fixedpoint-hash-linux
          path: ./lin

      - name: Download Windows hash
        uses: actions/download-artifact@v4
        with:
          name: fixedpoint-hash-windows
          path: ./win

      - name: Compare self-check hashes
        run: |
          echo "Linux:   $(cat lin/fixedpoint-hash-linux.txt)"
          echo "Windows: $(cat win/fixedpoint-hash-windows.txt)"
          tr -d '\r' < lin/fixedpoint-hash-linux.txt > lin.txt
          tr -d '\r' < win/fixedpoint-hash-windows.txt > win.txt
          if ! diff lin.txt win.txt; then
            echo "::error::FixedPoint.h self-check hash differs across OS — the Q40.24 library is not bit-identical."
            exit 1
          fi
          echo "FixedPoint.h self-check: cross-OS bit-identical."

  # M4A Block E — TSan gate enforcing the SyncedUpdate contract. Builds the engine
  # with -Db_sanitize=thread and runs three scenarios chosen for race surface:
  # M1Baseline (smoke / link-check), M4ThreadStress (parallel-AI saturation),
  # MPerfBench (120-actor stress). Advisory at landing (continue-on-error); flipped
  # to required once Source/CI/tsan-known-races.md stabilises. --runs 2 because TSan
  # is 5-15× slower. Per-scenario --threads forces a parallel Lua-state count even
  # for the smoke scenario so the threaded code paths actually execute.
  determinism-tsan-linux:
    runs-on: ubuntu-latest
    continue-on-error: true
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - { scenario: M1Baseline,     ticks: 600,  threads: 2 }
          - { scenario: M4ThreadStress, ticks: 900,  threads: 8 }
          - { scenario: MPerfBench,     ticks: 1200, threads: 8 }
    env:
      TSAN_OPTIONS: halt_on_error=0:history_size=7:second_deadlock_stack=1:symbolize=1:suppressions=${{ github.workspace }}/tsan-suppressions.txt
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y meson ninja-build pkg-config \
            libsdl2-dev libsdl2-image-dev libpng-dev libflac-dev \
            libminizip-dev libtbb-dev liblz4-dev libgl-dev

      # Newer Linux kernels default vm.mmap_rnd_bits=32, which exceeds what
      # libtsan's shadow-memory layout accepts ("FATAL: ThreadSanitizer:
      # unexpected memory mapping"). 28 is the documented working value.
      - name: Lower ASLR entropy for TSan
        run: sudo sysctl -w vm.mmap_rnd_bits=28

      - name: Configure (release + TSan)
        run: meson setup builddir --buildtype=release -Db_sanitize=thread -Db_lto=false

      - name: Build engine + cccp-ctl
        run: meson compile -C builddir

      # Inline known-noise suppressions. Sources documented entry-by-entry in
      # Source/CI/tsan-known-races.md — keep this list in lockstep with that
      # file. The .md is the human record + removal-path tracking; this
      # heredoc is what TSan actually reads.
      - name: Write TSan suppressions
        run: |
          cat > tsan-suppressions.txt <<'EOF'
          # LuaJIT — JIT-emitted machine code is opaque to TSan instrumentation;
          # the bring-up (Source/CI/m5-linux-x64.md:154) excluded LuaJIT entirely.
          # We can't filter the LuaJIT subproject's compile flags from this lane,
          # so suppress the JIT entry points by symbol prefix instead.
          race:^lj_

          # System libtbb is not built under -fsanitize=thread, so TSan can't see
          # std::execution::par_unseq join sync — yields a flood of false
          # positives in partitioner.h / parallel_for.h.
          called_from_lib:libtbb

          # PathFinder grid AdjacentCost ↔ UpdateNodeCosts — TBB par_unseq join
          # blind spot that persists after the PathFinder async-counter fix
          # (m5-linux-x64.md:174-176).
          race:AdjacentCost
          race:UpdateNodeCosts

          # Cosmetic render-side MOID race — UpdateDrawMOIDs vs main-thread Draw;
          # sim checksum is fed before the deferred draw task, so this does not
          # affect determinism (m5-linux-x64.md:251-258).
          race:UpdateDrawMOIDs
          race:MOSRotating::Draw
          EOF

      - name: Run determinism-check under TSan (${{ matrix.scenario }})
        run: |
          ./builddir/CortexCommand -determinism-check \
              --scenario ${{ matrix.scenario }} \
              --ticks ${{ matrix.ticks }} \
              --seed 42 \
              --threads ${{ matrix.threads }} \
              --runs 2 \
              --output ${{ matrix.scenario }}-tsan.json 2>&1 | tee ${{ matrix.scenario }}-tsan.log

      # Surfaces the race count as a PR-UI annotation and produces a small triage
      # file so reviewers don't have to scroll the full log. TSAN_REQUIRED=1 turns
      # this step into a fail-on-warning gate; the env var lives at job level so
      # promotion-to-required is a single change (see tsan-known-races.md).
      - name: Summarise TSan output
        if: always()
        run: |
          log=${{ matrix.scenario }}-tsan.log
          summary=${{ matrix.scenario }}-tsan-summary.txt
          if [ ! -f "$log" ]; then
            echo "no log file — run step likely failed before producing output" > "$summary"
            exit 0
          fi
          count=$(grep -c "WARNING: ThreadSanitizer" "$log" || true)
          echo "TSan warnings: $count" > "$summary"
          if [ "$count" != "0" ]; then
            echo "::warning::TSan detected $count race(s) in ${{ matrix.scenario }} — see artifact"
            grep -A 25 "WARNING: ThreadSanitizer" "$log" >> "$summary" || true
            if [ "${TSAN_REQUIRED:-0}" = "1" ]; then
              echo "::error::TSan gate is required and detected races; failing step."
              exit 1
            fi
          fi

      - name: Upload TSan report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: determinism-tsan-${{ matrix.scenario }}-linux
          path: |
            ${{ matrix.scenario }}-tsan.json
            ${{ matrix.scenario }}-tsan.log
            ${{ matrix.scenario }}-tsan-summary.txt
          if-no-files-found: warn
