name: Deploy modernization wiki

# Publishes the modernization-docs/ wiki to GitHub Pages.
# Deliberately scoped to this branch + folder so it never interferes
# with the game's own CI (ci.yml / meson.yml / msbuild.yml).

on:
  push:
    branches: [modernization-effort]
    paths:
      - 'modernization-docs/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload modernization-docs as the Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: modernization-docs

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
